<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>予約一覧</title>

<style>
	body{
		font-family: sans-serif;
		margin: 40px;
	}
	h2{
		text-align:center;
		
	}
	.top-area {
	           width: 1000px;
	           margin: 0 auto 20px;
	           text-align: right;
	       }

	       .top-area a {
	           display: inline-block;
	           padding: 8px 15px;
	           text-decoration: none;
	           background-color: #4CAF50;
	           color: white;
	           border-radius: 4px;
	       }

	       table {
	           width: max-content;
			   min-width :1400px;
	           margin: 0 auto;
	           border-collapse: collapse;
	       }

	       th,
	       td {
	           border: 1px solid #999;
	           padding: 10px;
	           text-align: center;
	       }

	       th {
	           background-color: #eeeeee;
	       }

	       .memo {
	           max-width: 200px;
	           word-break: break-all;
	       }

	       .delete-button {
	           padding: 5px 10px;
	           color: white;
	           background-color: #d9534f;
	           border: none;
	           border-radius: 4px;
	           cursor: pointer;
	       }

	       .empty {
	           text-align: center;
	           padding: 30px;
	       }
		   
		   .nowrap{
			white-space:nowrap;
		   }
		   
   </style>
</head>

<body>
 <h2>予約一覧</h2>
 
 <!-- 予約フォームへ -->
 <div class="top-area">
	<a th:href="@{/reservation/new}">
		新規予約
	</a>
 <a th:href="@{/menu}">
	メニューへ戻る
 </a>
 </div>
 
 <table>
	<thead>
		<tr>
			<th class="nowrap">物件名</th>
			<th>予約ID</th>
			<th class="nowrap">名前</thclass="nowrap">
			<th class="nowrap">電話番号</th>
			<th>メールアドレス</th>
			<th class="nowrap">予約日</th>
			<th class="nowrap">予約時間</th>
			<th>人数</th>
			<th>備考欄</th>
			<th>キャンセル</th>
		</tr>
  </thead>
  
  <tbody>
  	
 <tr th:each="reservation : ${reservations}">
  		
	    <td class="nowrap" th:text="${reservation.propertyName}">
			Aレジデンス
		</td>
		
  		<td th:text="${reservation.id}">
			1
		</td>
		  
  		<td class="nowrap" th:text="${reservation.name}">
			山田太郎
		</td>
  		<td  class="nowrap" th:text="${reservation.phoneNumber}">
			090-1234-5678
		</td>
  		<td th:text="${reservation.email}">
			example@example.com
		</td>
  		<td class="nowrap"  th:text="${reservation.reservationDate}">
			2026-10-10
		</td>
  		<td class="nowrap" th:text="${reservation.reservationTime}">
			11:00
		</td>
  		<td th:text="${reservation.numberOfPeople}">
			2
		</td>
  		<td th:text="${reservation.memo}">
			
		</td>
  	
  	<td>
		<form th:action="@{/reservations/delete}" method="post">

	 <!-- CSRF対策 -->
		<input type="hidden"
		      th:name="${_csrf.parameterName}"
			  th:value="${_csrf.token}">

        <input type="hidden" name="id"
		      th:value="${reservation.id}">

		<button type="submit"
		      class="delete-button">削除</button>
           </form>

	</td>

	</tr>
      <tr th:if="${#lists.isEmpty(reservations)}">
		  <td colspan="9" class="empty">
			予約はありません。</td>
    	 </tr>

     </tbody>

  </table>

</body>
</html>
