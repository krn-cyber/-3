<!DOCTYPE html>
<html　xmlns:th="thhp://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ご予約一覧</title>
</head>
<body>
 <h2>ご予約一覧</h2>
 
 <!-- 予約フォームへ -->
 <p>
	<a th:href="@{/reservations/new}">
		新しい予約を見る
	</a>
 </p>
 
 <!-- メニューへ戻る -->
  <p>
 	<a th:href="@{/menu}">
 		メニューへ戻る
 	</a>
  </p>
  
  <hr>
  
  <!-- 予約がない場合 -->
   <div th:if="${#lists.isEmpty(reservation)}">
  	 <p>現在、予約はありません</p>
  	</div>

  <!-- ご予約一覧 -->
  <table th:unless="${#lists.isEmpty(reservations)}"
  border = "1">
  
  <thead>
	<tr>
		<th>ID</th>
		<th>名前</th>
		<th>電話番号</th>
		<th>メールアドレス</th>
		<th>予約日</th>
		<th>予約時間</th>
		<th>人数</th>
		<th>備考欄</th>
		<th>キャンセル</th>
	</tr>
  </thead>
  
  ,<tbody>
	<tr th:each="reservation : ${reservations}">
		
		<td th:text="${reservation.id}"></td>
		<td th:text="${reservation.name}"></td>
		<td th:text="${reservation.phoneNumber}"></td>
		<td th:text="${reservation.email}"></td>
		<td th:text="${reservation.reservationDate}"></td>
		<td th:text="${reservation.reservationTime}"></td>
		<td th:text="${reservation.numberOfPeople}"></td>
		<td th:text="${reservation.memo}"></td>
	
	<td>
		<form th:action="@{/reservations/delete}"
		method ="post">
	
	<input type="hidden" name = "id"
	  th:value="${reservation.id}">
	  
	  <input type="submit" value="キャンセル"
	   onclik="return confirm('この予約をキャンセルしますか？');">
	</form>
	
	</td>
	
	</tr>
	
  </tbody>
  
  </table>
  
</body>
</html>
