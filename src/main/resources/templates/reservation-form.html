<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>予約登録</title>

<style>
    body {
        font-family: sans-serif;
        margin: 40px;
    }

    .form-container {
        width: 500px;
        margin: 0 auto;
    }

    h2 {
        text-align: center;
        margin-bottom: 30px;
    }

    .form-item {
        margin-bottom: 15px;
    }

    .form-item label {
        display: inline-block;
        width: 120px;
    }

    .form-item input,
    .form-item textarea {
        width: 300px;
        padding: 7px;
        box-sizing: border-box;
    }

    .form-item textarea {
        height: 100px;
        vertical-align: top;
    }

    .button-area {
        margin-top: 20px;
        text-align: center;
    }

    .button-area button,
    .button-area a {
        display: inline-block;
        padding: 10px 30px;
        margin: 5px;
        font-size: 14px;
        text-decoration: none;
        border: 1px solid #999;
        border-radius: 4px;
        cursor: pointer;
    }

    .button-area a {
        color: black;
        background-color: #f5f5f5;
    }
	.time-buttons {
	    display: flex;
	    flex-wrap: wrap;
	    gap: 10px;
	    margin-top: 10px;
		margin-left:120px;
	}

	.time-buttons label {
	    cursor: pointer;
	}

	.time-buttons input[type="radio"] {
	    display: none;
	}

	.time-buttons span {
	    display: inline-block;
	    padding: 12px 20px;
	    border: 1px solid #999;
	    border-radius: 8px;
	    background-color: white;
	    color: #333;
	    text-align: center;
	    min-width: 70px;
	}

	.time-buttons input[type="radio"]:checked + span {
	    background-color: #3478db;
	    color: white;
	    border-color: #3478db;
	}

	.time-buttons span:hover {
	    border-color: #3478db;
	}
</style>
</head>

<body>
<div class="form-container">

    <h2>予約登録</h2>
	
	<p th:if="${errorMessage}"
	   th:text="${errorMessage}"
	   style="color: red;"></p>

    <form th:action="@{/reservations}" method="post"
	      th:object="${reservation}">

        <!-- CSRF対策 -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
			   
		<div class="form-item">
		  <label for="propertyName">物件選択</label>
		  <select id="propertyName" name="propertyName" required>
			   <option value="">見学希望の物件を選択してください</option>
			   <option value="Aレジデンス">Aレジデンス</option>
			   <option value="パークハウスB">パークハウスB</option>
			   <option value="Cレジデンス">Cレジデンス</option>
			</select>
		 </div>	   

        <div class="form-item">
            <label for="name">名前</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-item">
            <label for="phonenumber">電話番号</label>
            <input type="tel" id="phonenumber"
                   name="phoneNumber" required>
        </div>

        <div class="form-item">
            <label for="email">メールアドレス</label>
            <input type="email" id="email"
                   name="email" required>
        </div>

        <div class="form-item">
            <label for="reservationdate">予約日</label>
            <input type="date" id="reservationdate"
                   name="reservationDate" required>
        </div>

        <div class="form-item">
            <label>予約時間</label>

			<div class="time-buttons">
			    <label>
			        <input type="radio" name="reservationTime" value="10:30" required>
			        <span>10:30</span>
			    </label>

			    <label>
			        <input type="radio" name="reservationTime" value="11:00">
			        <span>11:00</span>
			    </label>

			    <label>
			        <input type="radio" name="reservationTime" value="11:30">
			        <span>11:30</span>
			    </label>

			    <label>
			        <input type="radio" name="reservationTime" value="13:30">
			        <span>13:30</span>
			    </label>

			    <label>
			        <input type="radio" name="reservationTime" value="14:00">
			        <span>14:00</span>
			    </label>

			    <label>
			        <input type="radio" name="reservationTime" value="14:30">
			        <span>14:30</span>
			    </label>

			    <label>
			        <input type="radio" name="reservationTime" value="16:00">
			        <span>16:00</span>
			    </label>

			    <label>
			        <input type="radio" name="reservationTime" value="16:30">
			        <span>16:30</span>
			</label>
		 </div>
	 </div>

        <div class="form-item">
            <label for="numberOfPeople">予約人数</label>
            <input type="number" id="numberOfPeople"
                   name="numberOfPeople"
                   min="1" required>
        </div>

        <div class="form-item">
            <label for="memo">備考欄</label>
            <textarea id="memo" name="memo"></textarea>
        </div>

        <div class="button-area">
            <button type="submit">予約する</button>
            <a th:href="@{/menu}">戻る</a>
        </div>
    </form>

	</div>

</body>

</html>
